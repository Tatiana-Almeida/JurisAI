services:
  web:
    build: .
    command: gunicorn jurisai.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file: .env
    volumes:
      - .:/app
    ports:
      - '8000:8000'
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  worker:
    build: .
    command: celery -A jurisai worker --loglevel=info
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - redis
      - db

  flower:
    build: .
    command: celery -A jurisai flower --port=5555
    env_file: .env
    ports:
      - '5555:5555'
    depends_on:
      - redis

volumes:
  postgres_data:
